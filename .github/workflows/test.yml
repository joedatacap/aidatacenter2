name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: neocloud_ci_only
          POSTGRES_DB: neocloud_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enable TLS on disposable CI Postgres
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p work/tls
          openssl req -new -x509 -nodes -days 1 -subj '/CN=localhost' -out work/tls/server.crt -keyout work/tls/server.key 2>/dev/null
          docker cp work/tls/server.crt "$PG_CONTAINER:/var/lib/postgresql/data/server.crt"
          docker cp work/tls/server.key "$PG_CONTAINER:/var/lib/postgresql/data/server.key"
          docker exec "$PG_CONTAINER" chown postgres:postgres /var/lib/postgresql/data/server.crt /var/lib/postgresql/data/server.key
          docker exec "$PG_CONTAINER" chmod 600 /var/lib/postgresql/data/server.key
          docker exec "$PG_CONTAINER" psql -U postgres -c "ALTER SYSTEM SET ssl = on"
          docker exec "$PG_CONTAINER" psql -U postgres -c "SELECT pg_reload_conf()"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:neocloud_ci_only@localhost:5432/neocloud_ci?sslmode=require
      - run: python -m compileall -q neocloud
      - run: node --check neocloud/static/app.js
