name: TradingView prototype
on:
  push:
    branches: [prototype/tradingview-watchlist]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node prototypes/tradingview/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tradingview-prototype
          path: work/tradingview-proof/
