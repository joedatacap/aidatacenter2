name: November 23 SEC disclosure review
on: {push: {branches: [qa/disclosures-20261123]}}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_release_filings.py
      - uses: actions/upload-artifact@v4
        with:
          name: checked-index
          path: sec-index-result.json
