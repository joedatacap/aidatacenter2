name: Verify standalone research preview
on:
  push:
    branches: [preview-funding-20261127]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Open the review overview and reports over HTTPS in Chromium
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, subprocess, tempfile
          url='https://htmlpreview.github.io/?https://raw.githubusercontent.com/joedatacap/aidatacenter2/'+os.environ['PREVIEW_SHA']+'/'
          for page, marker in [('index.html','Nine-company call audit'),('NBIS.html','$95.50'),('CRWV.html','$48.60')]:
              with tempfile.TemporaryDirectory() as profile:
                  run=subprocess.run(['google-chrome','--headless','--disable-dev-shm-usage','--no-sandbox','--user-data-dir='+profile,'--virtual-time-budget=20000','--dump-dom',url+page],capture_output=True,text=True,timeout=55,check=True)
                  if marker not in run.stdout or 'uw-section' not in run.stdout:
                      print(run.stdout[:3000])
                      raise RuntimeError('Hosted research failed to render: '+page)
                  print(page,marker,'visible in rendered DOM',len(run.stdout))
          PY
