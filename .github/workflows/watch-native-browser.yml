name: Watch native browser proof
on:
  push:
    branches:
      - feat/release-tradingview
      - qa/watch-native-live
      - qa/watch-native-live-*
  workflow_dispatch:
    inputs:
      target:
        description: Controlled verification target
        type: choice
        options: [candidate, live]
        default: candidate
permissions:
  contents: read
jobs:
  native-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WATCH_NATIVE_MODE: ${{ (inputs.target == 'live' || startsWith(github.ref_name, 'qa/watch-native-live')) && 'live' || 'candidate' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the accepted hosted candidate
        run: python scripts/build_neocloud_watch.py --release --output work/neocloud-watch-site
      - name: Verify actual native widget, application and served assets
        run: node tests/watch-native/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-native-${{ env.WATCH_NATIVE_MODE }}-${{ github.sha }}
          path: work/watch-native-proof/
          if-no-files-found: warn
