name: Equity event review and prospective accountability
on:
  workflow_dispatch:
  schedule:
    # 07:45 Singapore after US weekday sessions. No live quote or broker feed.
    - cron: '45 23 * * 1-5'
permissions:
  contents: write # Only append-only research history branch; never application branches.
concurrency:
  group: equity-monitor-history
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test history and event integrity
        run: |
          python -m pip install pytest
          python -m pytest tests/test_equity_history.py tests/test_equity_events.py -q
      - uses: actions/checkout@v4
        with:
          path: work/history-store
          fetch-depth: 1
      - name: Restore durable history branch, never execute its contents
        working-directory: work/history-store
        run: |
          status=0
          git ls-remote --exit-code --heads origin equity-monitor-history || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch origin equity-monitor-history
            git checkout --detach FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git checkout --orphan equity-monitor-history
            git rm -rf .
          else
            exit "$status"
          fi
      - name: Seed reviewed archive without overwriting prior records
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('neocloud/data/equity-history')
          destination = Path('work/history-store/history')
          for item in source.rglob('*.json'):
              target = destination / item.relative_to(source)
              if target.exists():
                  if target.read_bytes() != item.read_bytes():
                      raise SystemExit('Archive collision; refusing to overwrite ' + str(target))
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(item, target)
          PY
      - name: Discover nine issuer disclosures and route changes with source errors
        run: python scripts/equity_events.py --history-dir work/history-store/history --output work/equity-monitor/events.json
      - name: Freeze report versions and score only verified observations
        run: python scripts/equity_history.py --history-dir work/history-store/history --output work/equity-monitor/scorecard.json
      - name: Build a review preview from this run
        run: PYTHONPATH=. python scripts/build_neocloud_watch.py --history-dir work/history-store/history --output work/equity-monitor/site
      - name: Persist append-only versions beyond artifact expiration
        working-directory: work/history-store
        run: |
          git config user.name 'Equity history workflow'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- history/
          if git diff --cached --name-status | grep -qv '^A'; then
            echo 'Refusing non-additive history change'
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Append equity monitoring and accountability records'
            git push origin HEAD:refs/heads/equity-monitor-history
          fi
      - name: Retain reviewable result including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equity-monitor-${{ github.run_id }}
          path: |
            work/equity-monitor/
            work/history-store/history/
          if-no-files-found: error
          retention-days: 90
