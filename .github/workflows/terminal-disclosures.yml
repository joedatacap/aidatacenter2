name: Terminal disclosure review queue
on:
  workflow_dispatch:
    inputs:
      since:
        description: Inclusive UTC filing/publication date (YYYY-MM-DD); blank scans 14 days
        type: string
        required: false
  schedule:
    # After each US weekday session: 07:30 Singapore on Tuesday-Saturday.
    - cron: '30 23 * * 1-5'
permissions:
  contents: read
concurrency:
  group: terminal-disclosure-intake
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public disclosures without promoting research
        env:
          DISCLOSURE_SINCE: ${{ inputs.since }}
        run: |
          args=()
          if [ -n "$DISCLOSURE_SINCE" ]; then args+=(--since "$DISCLOSURE_SINCE"); fi
          python scripts/check_terminal_disclosures.py "${args[@]}" --output work/terminal-disclosures.json
      - name: Retain review queue, including source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-disclosures-${{ github.run_id }}
          path: work/terminal-disclosures.json
          if-no-files-found: error
          retention-days: 30
