name: Verify standalone research preview
on:
  push:
    branches: [preview-funding-20261127]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Open the exact review revision from outside the development workspace
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime, hashlib, os, pathlib, urllib.request
          commit = os.environ['PREVIEW_SHA']
          origin = 'https://raw.githack.com/joedatacap/aidatacenter2/' + commit
          for name in ('index.html', 'NBIS.html', 'CRWV.html'):
              expected = pathlib.Path(name).read_bytes()
              with urllib.request.urlopen(origin + '/' + name, timeout=45) as response:
                  actual = response.read()
                  assert response.headers.get_content_type() == 'text/html', response.headers
              assert hashlib.sha256(actual).digest() == hashlib.sha256(expected).digest(), name
              print(datetime.datetime.now(datetime.timezone.utc), name, len(actual), hashlib.sha256(actual).hexdigest())
          PY
